<!-- Honeycomb PC Shell Component Template
Use for every PC admin prototype. Replace {{APP_NAME}}, {{LOGO_TEXT}}, {{NAV_ITEMS}}, {{CURRENT_TITLE}}, {{PAGE_CONTENT}}.
Do not change core dimensions: side nav 208px, topbar 48px, page padding/gap 12px.
-->
<div class="app">
  <aside class="sn" id="sn">
    <div class="sn-logo">
      <div class="sn-mark">{{LOGO_TEXT}}</div>
      <div class="sn-txt">{{APP_NAME}}</div>
      <button class="sn-toggle" type="button" aria-label="收起导航" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="sn-body">
      <ul class="nl">
        {{NAV_ITEMS}}
      </ul>
    </div>
    <div class="sn-foot">Powered by Honeycomb</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="bc">
        {{BREADCRUMB}}
      </div>
      <div class="tb-r">
        <button class="ib" aria-label="消息">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot"></span>
        </button>
        <button class="ib" aria-label="帮助"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c-.8 1.2-2.9 1.4-2.9 3"/><path d="M12 17h.01"/></svg></button>
        <button class="ib" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
        <div class="tb-div"></div>
        <div class="tb-user"><div class="av">{{USER_AVATAR}}</div><div class="u-name">{{USER_NAME}}</div></div>
      </div>
    </div>
    <section class="pb">
      {{PAGE_CONTENT}}
    </section>
  </main>
</div>
