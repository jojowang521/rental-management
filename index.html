<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- pages-rebuild: 20260524-local-sync2 -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI产品设计系统</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-bg: rgba(37, 99, 235, 0.06);
      --success: #15803d;
      --warning: #b45309;
      --error: #b91c1c;
      --text: #18181b;
      --muted: #71717a;
      --weak: #a1a1aa;
      --line: rgba(0, 0, 0, 0.06);
      --line-strong: rgba(0, 0, 0, 0.10);
      --page: #fafafa;
      --panel: #ffffff;
      --sidebar: #001529;
      --sidebar-soft: #0d2038;
      --sidebar-width: 228px;
      --sidebar-collapsed-width: 64px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      --radius: 12px;
      font-family: Inter, Geist, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--page);
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns 0.2s ease;
    }

    .app.nav-collapsed {
      grid-template-columns: var(--sidebar-collapsed-width) minmax(0, 1fr);
    }

    .sidebar {
      background: var(--sidebar);
      color: rgba(255, 255, 255, 0.86);
      padding: 18px 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      z-index: 20;
      transition: padding 0.2s ease;
    }

    .app.nav-collapsed .sidebar {
      padding: 18px 8px;
      overflow: visible;
      z-index: 60;
    }

    .brand {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 8px 14px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }

    .brand-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .brand-copy {
      min-width: 0;
      overflow: hidden;
    }

    .app.nav-collapsed .brand {
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 0 0 14px;
    }

    .app.nav-collapsed .brand-main {
      justify-content: center;
      width: 100%;
    }

    .app.nav-collapsed .brand-copy,
    .app.nav-collapsed .menu-group-title,
    .app.nav-collapsed .nav-text {
      display: none;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      font-weight: 700;
    }

    .brand-title {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.92);
    }

    .brand-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.52);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-group-title {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 16px 12px 8px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 650;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      border-radius: 6px;
      white-space: nowrap;
      min-width: 0;
    }

    .menu-group-title > span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-group-title:hover {
      color: rgba(255, 255, 255, 0.72);
      background: var(--sidebar-soft);
    }

    .group-arrow {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      opacity: 0.7;
      transition: transform 0.18s ease;
      white-space: nowrap;
    }

    .line-icon {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .menu-group-title.collapsed .group-arrow {
      transform: rotate(-90deg);
    }

    .nav-item {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, 0.76);
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 3px;
      white-space: nowrap;
    }

    .nav-group {
      overflow: hidden;
      display: grid;
      transition: grid-template-rows 0.2s ease;
      grid-template-rows: 1fr;
    }

    .nav-group.collapsed {
      grid-template-rows: 0fr;
    }

    .nav-group-inner {
      min-height: 0;
    }

    .app.nav-collapsed .nav-item {
      grid-template-columns: 1fr;
      place-items: center;
      padding: 10px;
      position: relative;
      z-index: 1;
    }

    .app.nav-collapsed .nav-item:hover,
    .app.nav-collapsed .nav-item:focus-visible {
      z-index: 80;
    }

    .app.nav-collapsed .nav-group,
    .app.nav-collapsed .nav-group-inner {
      overflow: visible;
    }

    .app.nav-collapsed .nav-item::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      z-index: 50;
      min-width: max-content;
      max-width: 180px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(24, 24, 27, 0.94);
      color: #ffffff;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .app.nav-collapsed .nav-item::before {
      content: "";
      position: absolute;
      left: calc(100% + 5px);
      top: 50%;
      z-index: 51;
      width: 8px;
      height: 8px;
      background: rgba(24, 24, 27, 0.94);
      transform: translateY(-50%) rotate(45deg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

    .app.nav-collapsed .nav-item:hover::after,
    .app.nav-collapsed .nav-item:focus-visible::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .app.nav-collapsed .nav-item:hover::before,
    .app.nav-collapsed .nav-item:focus-visible::before {
      opacity: 1;
    }

    .nav-item:hover { background: var(--sidebar-soft); color: white; }
    .nav-item.active {
      background: var(--primary);
      color: white;
      box-shadow: none;
    }
    .nav-icon,
    .ni-ic {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
    }
    .ni-img {
      width: 16px;
      height: 16px;
      display: block;
      opacity: 0.72;
      filter: invert(88%) sepia(6%) saturate(354%) hue-rotate(177deg) brightness(93%) contrast(90%);
    }
    .nav-item:hover .ni-img,
    .nav-item.active .ni-img {
      opacity: 0.98;
      filter: invert(100%);
    }
    .nav-text { min-width: 0; display: grid; gap: 2px; }
    .nav-label { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 58px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--weak);
      font-size: 13px;
      min-width: 0;
    }

    .crumb-current { color: var(--text); font-weight: 600; }
    .crumb-note {
      color: var(--weak);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-toggle {
      width: 26px;
      height: 26px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex: 0 0 auto;
    }

    .nav-toggle .line-icon {
      width: 18px;
      height: 18px;
      stroke-width: 1.8;
    }

    .nav-toggle-icon-img {
      width: 16px;
      height: 16px;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.92;
    }

    .nav-toggle:hover {
      color: var(--muted);
      border-color: var(--line-strong);
      background: #fff;
    }

    .nav-toggle:hover .nav-toggle-icon-img {
      filter: none;
      opacity: 1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input {
      width: 260px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      padding: 0 12px;
      outline: none;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .btn {
      min-height: 32px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover { color: var(--primary); border-color: var(--primary-hover); }
    .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }

    .content {
      padding: 20px 24px 28px;
      display: grid;
      gap: 16px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .blue-title {
      min-height: 48px;
      background: #fff;
      color: var(--text);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .blue-title h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .hero-body { padding: 18px; }

    body.preview-only .topbar {
      display: none;
    }

    body.preview-only main {
      min-height: 100vh;
      overflow: auto;
    }

    body.preview-only .content {
      padding: 0;
      min-width: 0;
    }

    body.preview-only .hero {
      max-width: none;
      width: 100%;
      min-width: 0;
      margin: 0;
      box-shadow: none;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    body.preview-only .hero-body {
      padding: 0;
    }

    body.preview-only .app:not(.nav-collapsed) .brand-copy,
    body.preview-only .nav-text {
      display: grid;
    }

    body.preview-only .menu-group-title {
      display: flex;
    }

    body.preview-only .app.nav-collapsed .brand-copy {
      display: none;
    }

    body.preview-only .nav-item {
      grid-template-columns: 24px minmax(0, 1fr);
      place-items: initial;
      padding: 8px 10px;
      min-width: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: #fff;
      min-height: 88px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      margin-top: 8px;
    }

    .stat-trend {
      color: var(--success);
      font-size: 12px;
      margin-top: 4px;
    }

    .fig-ref {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #fbfdff;
      min-height: 184px;
    }

    .fig-ref img {
      width: 100%;
      max-height: 160px;
      object-fit: contain;
      display: block;
      background: #111827;
      border-radius: 6px;
    }

    .fig-caption {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .page-preview-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      min-height: 0;
      width: 100%;
      min-width: 0;
    }

    body.preview-only .page-preview-card {
      border-radius: 0;
      border-left: 0;
      border-right: 0;
    }

    .page-preview-head {
      min-height: 64px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03);
    }

    body.preview-only .page-preview-head {
      position: fixed;
      top: 0;
      left: var(--sidebar-width);
      right: 0;
      z-index: 50;
    }

    body.preview-only .app.nav-collapsed .page-preview-head {
      left: var(--sidebar-collapsed-width);
    }

    .page-preview-title {
      font-size: 18px;
      font-weight: 650;
      white-space: nowrap;
    }

    .preview-switcher {
      display: inline-flex;
      max-width: calc(100vw - var(--sidebar-width) - 148px);
      overflow-x: auto;
      gap: 2px;
      padding: 2px;
      border-radius: 10px;
      background: #f4f4f5;
      scrollbar-width: none;
    }

    .preview-switcher::-webkit-scrollbar {
      display: none;
    }

    .preview-switcher button {
      border: 0;
      border-radius: 8px;
      background: transparent;
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 7px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .preview-switcher button.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      font-weight: 650;
    }

    .preview-stage {
      padding: 16px;
      background: #fafafa;
      overflow: auto;
      max-height: none;
      text-align: center;
      position: relative;
    }

    body.preview-only .preview-stage {
      padding-top: 80px;
    }

    .real-preview-image {
      width: 960px;
      max-width: 100%;
      height: auto;
      min-height: 0;
      display: inline-block;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      image-rendering: auto;
    }

    .project-preview-frame {
      width: 100%;
      height: calc(100vh - 96px);
      min-height: 760px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      display: block;
    }

    .project-preview-frame.is-preloading {
      position: absolute;
      left: -10000px;
      top: 0;
      opacity: 0;
      pointer-events: none;
    }

    .principles-panel {
      max-width: 1120px;
      margin: 0 auto;
      text-align: left;
      display: grid;
      gap: 14px;
    }

    .principles-hero {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px 24px;
    }

    .principles-hero h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.35;
    }

    .principles-hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .principles-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .principle-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .principle-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .principle-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .language-panel {
      max-width: 1180px;
      margin: 0 auto;
      text-align: left;
      display: grid;
      gap: 12px;
    }

    .language-hero {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
    }

    .language-eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .language-hero h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.35;
    }

    .language-hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 760px;
    }

    .language-hero-metric {
      min-width: 210px;
      border: 1px solid #d9e8ff;
      background: #f3f8ff;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .language-hero-metric strong {
      display: block;
      color: var(--primary);
      font-size: 24px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .language-hero-metric span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .language-section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .language-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .language-section-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.4;
    }

    .language-section-kicker {
      color: var(--weak);
      font-size: 12px;
      white-space: nowrap;
    }

    .flow-compare {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .flow-column {
      border: 1px solid #edf1f7;
      border-radius: 8px;
      background: #fbfcff;
      padding: 16px;
    }

    .flow-column.ai {
      border-color: #cfe3ff;
      background: #f6faff;
    }

    .flow-column-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .language-badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
    }

    .language-badge.blue {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .flow-steps {
      display: grid;
      gap: 8px;
    }

    .flow-step {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .flow-step-mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eef2f7;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
    }

    .flow-column.ai .flow-step-mark {
      background: var(--primary);
      color: #fff;
    }

    .direction-grid,
    .input-mode-grid,
    .principle-five-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .direction-card,
    .input-mode-card,
    .info-layer,
    .quality-card,
    .layout-choice-card,
    .principle-five-card {
      border: 1px solid #edf1f7;
      border-radius: 8px;
      background: #fbfcff;
      padding: 16px;
    }

    .direction-card.primary,
    .layout-choice-card.primary {
      border-color: #cfe3ff;
      background: #f6faff;
    }

    .direction-card h4,
    .input-mode-card h4,
    .info-layer h4,
    .quality-card h4,
    .layout-choice-card h4,
    .principle-five-card h4 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.4;
    }

    .direction-card p,
    .input-mode-card p,
    .info-layer p,
    .quality-card p,
    .layout-choice-card p,
    .principle-five-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;

    function statusTag(status) {
      const cls = status.includes("待") ? "gold" : status.includes("风险") ? "red" : status.includes("可用") || status.includes("运行") ? "green" : "";
      return `<span class="tag ${cls}">${status}</span>`;
    }

    function navIcon(iconKey) {
      const key = iconKey || "dashboard";
      const source = `assets/icons/navigation/svg/${key}.svg`;
      return `<span class="nav-icon ni-ic" data-icon-key="${key}" data-icon-source="${source}"><img class="ni-img" src="${source}" alt=""></span>`;
    }

    function lineIcon(name) {
      const paths = {
        left: '<path d="M10 4 6 8l4 4"></path>',
        right: '<path d="m6 4 4 4-4 4"></path>',
        down: '<path d="m4 6 4 4 4-4"></path>',
        panel: '<rect x="2.5" y="2.5" width="11" height="11" rx="1.5"></rect><path d="M6.5 2.5v11"></path>'
      };
      return `<svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true">${paths[name] || paths.down}</svg>`;
    }

    function renderNav() {
      const groups = [];
      sections.forEach((section, index) => {
        let group = groups.find(item => item.name === section.group);
        if (!group) {
          group = { name: section.group, items: [] };
          groups.push(group);
        }
        group.items.push({ section, index });
      });

      groups.forEach(group => {
        if (state.expandedGroups[group.name] === undefined) {
          state.expandedGroups[group.name] = true;
        }
      });
      state.expandedGroups[currentSection().group] = true;

      nav.innerHTML = groups.map(group => {
        const collapsed = !state.expandedGroups[group.name];
        return `
          <button class="menu-group-title ${collapsed ? "collapsed" : ""}" type="button" data-group="${group.name}" aria-expanded="${!collapsed}">
            <span>${group.name}</span>
            <span class="group-arrow">${lineIcon("down")}</span>
          </button>
          <div class="nav-group ${collapsed ? "collapsed" : ""}">
            <div class="nav-group-inner">
              ${group.items.map(({ section, index }) => `
                <button class="nav-item ${index === state.sectionIndex ? "active" : ""}" type="button" data-section="${index}" data-tip="${section.label}" title="${section.label}">
                  ${navIcon(section.iconKey)}
                  <span class="nav-text">
                    <span class="nav-label">${section.label}</span>
                  </span>
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");

      nav.querySelectorAll(".menu-group-title").forEach(button => {
        button.addEventListener("click", () => {
          const group = button.dataset.group;
          state.expandedGroups[group] = !state.expandedGroups[group];
          renderNav();
        });
      });

      nav.querySelectorAll(".nav-item").forEach(button => {
        button.addEventListener("click", () => {
          const nextSectionIndex = Number(button.dataset.section);
          if (nextSectionIndex === state.sectionIndex) return;
          state.sectionIndex = nextSectionIndex;
          state.expandedGroups[currentSection().group] = true;
          state.pageIndex = 0;
          state.tab = "preview";
          state.previewIndex = 0;
          if (["frame-sidebar", "frame-workbench"].includes(currentSection().id)) {
            state.navCollapsed = true;
          }
          render();
        });
      });

    function renderHeader() {
      const section = currentSection();

    function renderPagePreview() {
      const sitePage = (id, panel = "") => `assets/site-pages.html?embed=1&v=20260524-local-sync2${panel ? `&panel=${panel}` : ""}#${id}`;

      const section = currentSection();
      const previews = previewSets[section.id] || previewSets["frame-selector"];
      if (state.previewIndex >= previews.length) state.previewIndex = 0;
      const active = previews[state.previewIndex];
      const previewTitle = section.label;
      const switcher = previews.length > 1 ? `
          <div class="preview-switcher">
            ${previews.map((item, index) => `<button class="${index === state.previewIndex ? "active" : ""}" type="button" data-preview="${index}">${previewName(item)}</button>`).join("")}

        ` : "";
      const headHtml = `
        <div class="page-preview-head">
          <div class="page-preview-title">${previewTitle}</div>
          ${switcher}
        </div>`;
      const nextPreviewKey = `${section.id}:${state.previewIndex}:${active.frame || active.src || active.type || active.label}`;
      const existingStage = pagePreview.querySelector(".preview-stage");
      const existingHead = pagePreview.querySelector(".page-preview-head");

      if (active.frame && existingStage && state.previewRenderKey !== nextPreviewKey) {
        if (existingHead) {
          existingHead.outerHTML = headHtml;
        }
        preloadFrameIntoStage(existingStage, active, nextPreviewKey);
        bindPreviewSwitcher();
        return;
      }

      if (state.previewRenderKey === nextPreviewKey && existingHead) {
        existingHead.outerHTML = headHtml;
        bindPreviewSwitcher();
        return;
      }

      pagePreview.innerHTML = `
        ${headHtml}
        <div class="preview-stage">
          ${renderMiniPreview(active)}
        </div>
      `;
      state.previewRenderKey = nextPreviewKey;
      scalePreviewImage();
      bindPreviewSwitcher();
    }

    function bindPreviewSwitcher() {
      pagePreview.querySelectorAll("[data-preview]").forEach(button => {

          const stage = pagePreview.querySelector(".preview-stage");
          if (stage) stage.scrollTo({ top: 0, left: 0 });
        });
      });
    }

    function preloadFrameIntoStage(stage, preview, previewKey) {
      const frame = document.createElement("iframe");
      frame.className = "project-preview-frame is-preloading";
      frame.src = preview.frame;
      frame.title = previewName(preview);
      frame.addEventListener("load", () => {
        if (state.previewRenderKey === previewKey) return;
        frame.classList.remove("is-preloading");
        stage.replaceChildren(frame);
        stage.scrollTo({ top: 0, left: 0 });
        state.previewRenderKey = previewKey;
      }, { once: true });
      stage.appendChild(frame);
    }

        return `<img class="real-preview-image" src="${encodeURI(preview.src)}" alt="${previewName(preview)} 真实设计稿预览" />`;

      const stage = pagePreview.querySelector(".preview-stage");

      if (!stage || !image) return;

      const applyScale = () => {
        image.style.width = `${Math.round(image.naturalWidth * 0.4)}px`;
        image.style.height = "auto";
        stage.scrollLeft = 0;
        stage.scrollTop = 0;
      };

      if (image.complete && image.naturalWidth) {
        applyScale();
      } else {
        image.addEventListener("load", applyScale, { once: true });
      }
    }

              <li><span class="time-dot"></span><div><div class="time-title">AI 识别</div><div class="time-desc">抽取字段、生成摘要、标注置信度和证据位置。</div></div></li>
              <li><span class="time-dot"></span><div><div class="time-title">规则校验</div><div class="time-desc">执行必填、格式、主数据、风控和审批规则。</div></div></li>
              <li><span class="time-dot"></span><div><div class="time-title">人工确认</div><div class="time-desc">低置信字段进入确认区，高置信字段自动填充。</div></div></li>
              <li><span class="time-dot"></span><div><div class="time-title">提交归档</div><div class="time-desc">形成业务单据、审核记录和分析指标。</div></div></li>
            </ul>
          </div>
        </div>
      `;
    }

    function renderFlowTab(page) {
      return `
        ${screenHeader(page)}
        <div class="mock-body">
          ${renderFlowScreen(page).replace(screenHeader(page), "")}
        </div>
      `;
    }

    function renderDataTab(page) {
      return `
        ${screenHeader(page)}
        <div class="mock-body">
          <div class="table-scroll">
            <table>
              <thead><tr><th>字段</th><th>类型</th><th>来源</th><th>交互说明</th></tr></thead>
              <tbody>
                <tr><td>pageName</td><td>String</td><td>导航</td><td>${page.name}</td></tr>
                <tr><td>category</td><td>Enum</td><td>蓝色标题</td><td>${currentSection().label}</td></tr>
                <tr><td>aiConfidence</td><td>Number</td><td>AI 识别</td><td>用于展示置信度、异常提示和审核建议。</td></tr>
                <tr><td>businessStatus</td><td>Enum</td><td>流程状态</td><td>${page.status}</td></tr>
                <tr><td>evidenceList</td><td>Array</td><td>附件/原文</td><td>点击详情或查看证据时打开右侧抽屉。</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function taskTable() {
      return `
        <table>
          <thead><tr><th>任务</th><th>分类</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>合同附件智能录入</td><td>录入</td><td><span class="tag red">高</span></td><td>待处理</td><td><button class="link js-drawer" type="button">打开</button></td></tr>
            <tr><td>本月待审核合同查询</td><td>查询</td><td><span class="tag gold">中</span></td><td>可执行</td><td><button class="link js-toast" type="button">运行</button></td></tr>
            <tr><td>异常字段归因分析</td><td>分析</td><td><span class="tag gray">低</span></td><td>已生成</td><td><button class="link js-drawer" type="button">查看</button></td></tr>
          </tbody>
        </table>
      `;
    }

    function resultTable() {
      return `
        <table>
          <thead><tr><th>单据编号</th><th>客户</th><th>金额</th><th>AI 状态</th><th>业务状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>HT-20260515-001</td><td>明源云生态客户</td><td>¥168,000</td><td><span class="tag green">高置信</span></td><td>待审核</td><td><button class="link js-drawer" type="button">详情</button></td></tr>
            <tr><td>HT-20260515-002</td><td>城市空间运营</td><td>¥92,400</td><td><span class="tag gold">待确认</span></td><td>录入中</td><td><button class="link js-drawer" type="button">详情</button></td></tr>
            <tr><td>HT-20260515-003</td><td>产业园服务中心</td><td>¥236,800</td><td><span class="tag green">高置信</span></td><td>已通过</td><td><button class="link js-drawer" type="button">详情</button></td></tr>
            <tr><td>HT-20260515-004</td><td>商业资产管理</td><td>¥58,600</td><td><span class="tag red">异常</span></td><td>退回补录</td><td><button class="link js-drawer" type="button">详情</button></td></tr>
          </tbody>
        </table>
      `;
    }

    function bar(label, value) {
      return `<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${value}%"></div></div><span>${value}%</span></div>`;
    }

    function bindCanvasActions() {
      bindModeButtons();
      canvas.querySelectorAll(".js-toast").forEach(button => button.addEventListener("click", () => showToast("操作已模拟完成")));
      canvas.querySelectorAll(".js-drawer").forEach(button => button.addEventListener("click", () => openDrawer()));
    }

    function renderCanvas() {
      if (!canvas) return;
      const page = currentPage();
      if (state.tab === "flow") canvas.innerHTML = renderFlowTab(page);
      else if (state.tab === "data") canvas.innerHTML = renderDataTab(page);
      else canvas.innerHTML = renderPreview(page);
      bindCanvasActions();
      renderTabs();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function openDrawer() {
      const page = currentPage();
      drawerTitle.textContent = `${page.name} · 详情`;
      drawerBody.innerHTML = `
        <div class="assistant-bar">
          <div class="ai-dot">AI</div>
          <div>
            <div class="assistant-title">证据与上下文</div>
            <div class="assistant-desc">这里模拟从原始附件、识别文本和业务规则中汇总的详情信息。</div>
          </div>
        </div>
        <table>
          <tbody>
            <tr><th>当前分类</th><td>${currentSection().label}</td></tr>
            <tr><th>页面名称</th><td>${page.name}</td></tr>
            <tr><th>页面状态</th><td>${page.status}</td></tr>
            <tr><th>AI 建议</th><td>建议优先确认低置信字段，再提交到后续流程。</td></tr>
            <tr><th>证据来源</th><td>附件文本、历史单据、主数据与审批规则。</td></tr>
          </tbody>
        </table>
        <div class="toolbar">
          <div class="toolbar-left"><span class="tag green">可继续操作</span></div>
          <div class="toolbar-right"><button class="btn primary js-toast" type="button">采纳建议</button></div>
        </div>
      `;
      drawer.classList.add("open");
      mask.classList.add("open");
      drawerBody.querySelectorAll(".js-toast").forEach(button => button.addEventListener("click", () => showToast("已采纳 AI 建议")));
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      mask.classList.remove("open");
    }

    function render() {
      appShell.classList.toggle("nav-collapsed", state.navCollapsed);
      navToggle.setAttribute("aria-label", state.navCollapsed ? "展开左侧导航" : "收起左侧导航");
      navToggle.setAttribute("title", state.navCollapsed ? "展开左侧导航" : "收起左侧导航");
      navToggle.innerHTML = '<img class="nav-toggle-icon-img" src="assets/icons/fold.svg" alt="">';
      renderNav();
      renderHeader();
    }

    navToggle.addEventListener("pointerdown", event => {
      event.preventDefault();
      state.navCollapsed = !state.navCollapsed;
      render();
    });
    document.querySelector("#closeDrawer").addEventListener("click", closeDrawer);
    mask.addEventListener("click", closeDrawer);
    document.querySelector("#previewBtn").addEventListener("click", () => openDrawer());
    document.querySelector("#submitBtn").addEventListener("click", () => showToast("模拟提交成功"));
    document.querySelector("#globalSearch").addEventListener("input", event => {
      const keyword = event.target.value.trim();
      if (!keyword) return;
      const sectionIndex = sections.findIndex(section =>
        section.label.includes(keyword) ||
        section.note.includes(keyword) ||
        section.pages.some(page => page.name.includes(keyword) || page.desc.includes(keyword))
      );
      if (sectionIndex >= 0 && sectionIndex !== state.sectionIndex) {
        state.sectionIndex = sectionIndex;
        state.pageIndex = 0;
        render();
      }
    });

    render();
  </script>
</body>
</html>
