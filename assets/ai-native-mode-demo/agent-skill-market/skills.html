<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --card: #fff;
      --text: #1f2329;
      --muted: #646a73;
      --line: #e9edf2;
      --active: #3478f6;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--bg); color: var(--text); }

    .market-page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 16px 56px 8px;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: #f7f8fa;
    }

    .market-page::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .market-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      margin: 0 0 12px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      color: #25272c;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .market-search {
      display: flex;
      align-items: center;
      width: 300px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: #9aa1ad;
      font-size: 14px;
      box-shadow: var(--shadow);
    }

    .market-tabs {
      display: flex;
      gap: 12px;
      width: 100%;
      margin: 0 0 12px;
      padding: 0;
      overflow-x: auto;
      flex: 0 0 auto;
    }

    .market-tab {
      flex: 0 0 auto;
      height: 28px;
      padding: 3px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #555d6b;
      font-size: 13px;
      font-weight: 500;
      line-height: 22px;
      cursor: pointer;
    }

    .market-tab:hover {
      background: #f2f4f6;
    }

    .market-tab.active {
      background: #e9ecff;
      color: #222;
    }

    .skill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(230px, 1fr));
      gap: 12px;
      width: 100%;
      margin: 0;
    }

    .market-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 12px 0 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .market-scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .skill-card {
      min-height: 142px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .skill-card:hover {
      transform: translateY(-2px);
      border-color: #cfe0ff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
    }

    .skill-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .skill-id {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .skill-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .tone-blue { background: #eaf3ff; color: #4c8dff; }
    .tone-cyan { background: #e8f8ff; color: #38a9df; }
    .tone-orange { background: #fff1df; color: #ff9d3d; }
    .tone-violet { background: #f2e8ff; color: #9363f2; }
    .tone-green { background: #e9f9f1; color: #45b879; }
    .tone-rose { background: #ffe8f1; color: #ef5b8b; }

    .skill-card h2 {
      margin: 0;
      overflow: hidden;
      min-width: 0;
      color: #22252b;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      height: 28px;
      min-width: 52px;
      padding: 0 12px;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      background: #fff;
      color: #4e5969;
      font-size: 12px;
      font-weight: 500;
      line-height: 26px;
      white-space: nowrap;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, border-color .16s ease, color .16s ease, background .16s ease;
    }

    .skill-card:hover .skill-action,
    .skill-card:focus-within .skill-action {
      opacity: 1;
      pointer-events: auto;
    }

    .skill-action:hover {
      border-color: #C7D1FF;
      color: #3456F0;
      background: #fff;
    }

    .skill-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    @media (max-width: 1180px) {
      .market-page { padding: 16px 32px 8px; }
      .skill-grid { grid-template-columns: repeat(3, minmax(220px, 1fr)); }
    }

    @media (max-width: 820px) {
      .market-head { align-items: flex-start; flex-direction: column; }
      .market-search { width: 100%; }
      .skill-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="market-page">
    <header class="market-head">
      <h1>技能</h1>
      <div class="market-search">搜索技能</div>
    </header>
    <nav class="market-tabs" aria-label="技能分类">
      <button class="market-tab active">全部</button>
      <button class="market-tab">通用</button>
      <button class="market-tab">基础数据</button>
      <button class="market-tab">成本</button>
      <button class="market-tab">售楼</button>
      <button class="market-tab">资管</button>
      <button class="market-tab">租赁</button>
    </nav>
    <div class="market-scroll">
      <section class="skill-grid" id="skillGrid" aria-label="技能列表"></section>
    </div>
  </main>
  <script>
    const tones = ['blue', 'cyan', 'orange', 'violet', 'green', 'rose'];
    const skills = [
      ['自然语言意图识别', '通用', '把用户的口语化提问解析为可执行的查询条件、参数、动作。'],
      ['多轮对话编排', '通用', '维持上下文，支持追问、改写、纠错，确保任务一次说不清也能闭环。'],
      ['文档 OCR 识别', '通用', '图片、扫描件、PDF 中提取文字与版面信息，含手写体与盖章页处理。'],
      ['表格结构化抽取', '通用', '从图片或非结构化文档中识别表格，输出标准行列数据。'],
      ['审批规则校验', '基础数据', '业务资料与系统数据按规则对比，输出风险清单。'],
      ['待办消息检索', '基础数据', '按账号实时聚合待办、待阅，按优先级排序。'],
      ['权限定位', '基础数据', '输入账号即输出权限清单与摘要，定位权限设置问题。'],
      ['文档辅助阅读', '基础数据', '文档加问题，快速生成内容总结并定位引用。'],
      ['科目指标分析', '成本', '覆盖 30+ 标准指标，按项目、科目、业态、趋势 4 视角问数与分析。'],
      ['清单组价', '成本', '基于市场价库和历史成本，自动完成工程量清单组价。'],
      ['控制价审核报告生成', '成本', '汇总科目对比、清单组价合理性、风险点，输出审核报告。'],
      ['付款规则预审', '成本', '从概算、合同、账户、发票、工程量、进度等维度批量校验。'],
      ['一房一价测算', '售楼', '自动筛选房源、计算调价方案并评估货值影响。'],
      ['成交结构分析', '售楼', '产品与户型成交结构、同环比、换退房异常识别。'],
      ['跨台账查询', '资管', '覆盖项目、资产、资源、合同、费用、收缴等业务台账的跨表查询。'],
      ['经营复盘生成', '资管', '自动汇总经营数据并提炼结论，输出经营复盘材料。'],
      ['租赁合同抽取', '租赁', '租赁合同要素抽取与自动结构化，提升录入吞吐量与准确率。'],
      ['商务条款审核', '租赁', '对照租赁商务政策审核条款合理性，保障租赁合同收益。']
    ];

    const grid = document.getElementById('skillGrid');
    function render(list) {
      grid.innerHTML = list.map(item => {
        const sourceIndex = skills.findIndex(source => source[0] === item[0]);
        const tone = tones[sourceIndex % tones.length];
        return `
          <article class="skill-card">
            <div class="skill-top">
              <div class="skill-id">
                <span class="skill-icon tone-${tone}">${item[0].slice(0, 1)}</span>
                <h2>${item[0]}</h2>
              </div>
              <button class="skill-action" type="button">安装</button>
            </div>
            <p>${item[2]}</p>
          </article>
        `;
      }).join('');
    }

    render(skills);

    document.querySelectorAll('.market-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.market-tab').forEach(item => item.classList.remove('active'));
        tab.classList.add('active');
        const value = tab.textContent.trim();
        render(value === '全部' ? skills : skills.filter(item => item[1] === value));
      });
    });
  </script>
</body>
</html>
