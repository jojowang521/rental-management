场景名称: AI 辅助录入
AI专员名称: 合同登记 AI 助手
AI专员简介: 协助合同录入、字段提取、表单填充和合同规则预审。
头像色: blue
---

# 场景说明

成本专员在合同登记列表页点击「AI 合同录入」后，通过侧边栏上传合同文档。合同登记 AI 助手会模拟读取合同 PDF，提取合同基础信息、主体信息、价格信息和付款条件，并把结果应用到新增合同表单中，完成后自动关闭侧边栏，让用户回到表单核对。

---

# 交互流程

## 步骤 1：上传合同文档

> ### 触发方式
> 用户在合同登记列表页点击「AI 合同录入」后自动触发

### AI 台词

合同登记 AI 助手：请上传需要登记的合同文档，我会为您提取合同信息并自动生成新增合同表单。

**上传要求**

| 项目 | 要求 |
|---|---|
| 支持格式 | PDF / Word / 图片 |
| 文件数量 | 单文件 |
| 文件大小 | ≤ 50MB |
| 建议资料 | 合同正文、签章页、价格条款、付款条款 |

### 确认节点（可选）

无

### 操作按钮

- 「上传文档」→ 进入步骤 2

### 右侧面板

无需生成物卡片

**工作台卡片：上传指引**

查看合同录入所需资料、文件要求和本次演示边界。

**上传说明**

| 项目 | 内容 |

# 常见追问

## 为什么录入完成后侧边栏会关闭？

因为合同录入后的主要任务是核对表单字段，关闭侧边栏可以让用户专注主页面表单，避免遮挡字段。

## 未识别字段怎么处理？

未识别字段会保留为空或标记为未识别，用户可以在主页面表单中人工补充。

## 这是真实上传吗？

当前 Demo 使用样例文件模拟上传和解析，真实文件选择、PDF 解析和后端保存需要后续接入。

# 常见追问

## 哪些风险需要先处理？

建议先处理 BUS-001、BUS-017 和 FIN-003，因为它们会影响合同金额、材料价格合理性和税率合规。

## AI 预审结果能直接作为审批结论吗？

不能。当前结果用于辅助审查，正式结论仍需成本经理、合约部和财务税务按制度确认。

## 为什么审查完成后侧边栏不关闭？

因为审查结果需要和主页面合同表单对照修改，保持侧边栏打开能减少来回切换。
