    <link rel="stylesheet" crossorigin href="./assets/index-CSRTDniH.css">
    <link rel="stylesheet" href="./assets/figma-shell-overrides.css?v=20260523-agent-avatar">
    <script>
      function openAiEntryWhenReady(attempt) {
        var entry = document.querySelector('.ai-entry-button');
        var drawer = document.querySelector('.sidebar-shell--open');
        if (drawer) return;
        if (entry) {
          entry.click();
          return;
        }
        if (attempt < 20) {
          setTimeout(function() { openAiEntryWhenReady(attempt + 1); }, 120);
        }
      }

      window.addEventListener('message', function(event) {
        if (!event.data || event.data.type !== 'workbench:open-ai-drawer') return;
        openAiEntryWhenReady(0);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
